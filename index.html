<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Gujrat Tractors - Industrial & Road Roller Parts</title>
    <style>
        /* Base Reset & Variables */
        :root {
            --primary-color: #0f172a;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --text-dark: #334155;
            --text-muted: #64748b;
            --text-light: #f8fafc;
            --bg-light: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Top Bar */
        .top-bar {
            background-color: #0284c7;
            color: white;
            padding: 8px 20px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .top-bar-links a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-weight: 600;
        }

        /* Header Section */
        header {
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 50px 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent-color);
        }

        header h1 {
            font-size: 2.8rem;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: #ffffff;
        }

        header p {
            font-size: 1.15rem;
            max-width: 800px;
            margin: 0 auto 15px auto;
            color: #94a3b8;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .badge {
            background-color: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 500;
        }

        .badge.verified {
            background-color: #0369a1;
            border-color: #0284c7;
            color: white;
        }

        /* Container & Grid Setup */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Two Column Layout for Profiles */
        .profile-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .about-card, .factsheet-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .section-heading {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .about-card p {
            margin-bottom: 15px;
            color: #475569;
        }

        /* Factsheet List */
        .fact-table {
            width: 100%;
            border-collapse: collapse;
        }

        .fact-table tr {
            border-bottom: 1px solid #f1f5f9;
        }

        .fact-table tr:last-child {
            border-bottom: none;
        }

        .fact-table td {
            padding: 10px 0;
            font-size: 0.95rem;
        }

        .fact-label {
            font-weight: 600;
            color: var(--text-muted);
            width: 45%;
        }

        .fact-value {
            color: var(--primary-color);
            font-weight: 500;
        }

        .notice-box {
            background-color: #fff7ed;
            border-left: 4px solid #ea580c;
            color: #c2410c;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* Category Blocks */
        .catalog-block {
            margin-bottom: 50px;
        }

        .block-title {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .block-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: #cbd5e1;
        }

        .product-card h3 {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .product-card p {
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .visual-note {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
            margin-top: auto;
            font-weight: 500;
        }

        /* Contact & Navigation Section */
        .contact-section {
            background-color: var(--primary-color);
            color: var(--text-light);
            border-radius: 8px;
            padding: 40px;
            margin-top: 40px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .contact-info h2, .contact-nav h2 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        .contact-info p {
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .info-item {
            display: flex;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        .info-item-label {
            font-weight: 600;
            color: var(--accent-color);
            width: 100px;
            flex-shrink: 0;
        }

        .info-item-value {
            color: #f1f5f9;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
            text-align: center;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid #475569;
            color: #cbd5e1;
            margin-left: 10px;
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: #94a3b8;
        }

        .action-buttons {
            margin-top: 20px;
            display: flex;
        }

        /* Footer */
        footer {
            background-color: #0b0f19;
            color: #64748b;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            font-size: 0.85rem;
            border-top: 1px solid #1e293b;
        }

        footer a {
            color: #94a3b8;
            text-decoration: none;
        }

        footer a:hover {
            color: var(--accent-color);
        }

        /* Responsive Breakpoints */
        @media (max-width: 992px) {
            .profile-grid, .contact-section { grid-template-columns: 1fr; gap: 30px; }
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2.1rem; }
            .action-buttons { flex-direction: column; gap: 10px; }
            .btn-outline { margin-left: 0; }
        }
    </style>
</head>
